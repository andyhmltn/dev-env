set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -s extended-keys on
set -g focus-events on
set -s set-clipboard on
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g remain-on-exit off

set-option -g default-shell "/opt/homebrew/bin/fish"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key x kill-pane
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key g new-window -n lazygit -c "#{pane_current_path}" lazygit
bind-key r source-file ~/.tmux.conf \; display-message "config reloaded"

bind-key C command-prompt -p "Change directory:" "run-shell '~/.tmux-cd.sh %1'"

bind-key W {
    if-shell -F '#{==:#{session_name},wiki}' {
        detach-client
    } {
        display-popup -E -w 90% -h 85% 'tmux new-session -A -s wiki "tmux set-option status off; exec nvim ~/vimwiki/index.wiki"'
    }
}

# Preserve the invoking pane so Reviewer can return feedback to the correct Codex session.
bind-key h set-environment -gF REVIEWER_CODEX_PANE '#{pane_id}' \; \
    new-window -n reviewer -c '#{pane_current_path}' \
    '/Users/andy/.cargo/bin/reviewer codex-tmux --target-pane "$REVIEWER_CODEX_PANE" --unstaged-or-pr'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

%hidden OXO_BG="#161616"
%hidden OXO_BG_ALT="#262626"
%hidden OXO_FG="#f2f4f8"
%hidden OXO_MUTED="#525252"
%hidden OXO_BLUE="#33b1ff"
%hidden OXO_PINK="#ee5396"
%hidden OXO_GREEN="#42be65"
%hidden OXO_PURPLE="#be95ff"
%hidden OXO_CYAN="#3ddbd9"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=$OXO_FG"

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=$OXO_BG,bg=$OXO_PURPLE,bold] #S #[fg=$OXO_PURPLE,bg=default]  "
set -g status-right "#[fg=$OXO_MUTED]#{pane_current_path}  #[fg=$OXO_BLUE]%H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=$OXO_MUTED,bg=default"
setw -g window-status-format " #I #W "
setw -g window-status-current-style "fg=$OXO_BG,bg=$OXO_BLUE,bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-activity-style "fg=$OXO_PINK,bg=default"

set -g message-style "fg=$OXO_FG,bg=$OXO_BG_ALT"
set -g message-command-style "fg=$OXO_FG,bg=$OXO_BG_ALT"

set -g pane-border-style "fg=$OXO_BG_ALT"
set -g pane-active-border-style "fg=$OXO_PURPLE"

set -g mode-style "fg=$OXO_BG,bg=$OXO_CYAN"
set -g copy-mode-match-style "fg=$OXO_BG,bg=$OXO_GREEN"
set -g copy-mode-current-match-style "fg=$OXO_BG,bg=$OXO_PINK"

set -g clock-mode-colour "$OXO_BLUE"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

%hidden BUDDY_BIN="/Users/andy/dev/buddy/target/release/buddy"
bind-key a run-shell "$BUDDY_BIN focus"
bind-key A run-shell "$BUDDY_BIN kill"
set-hook -g after-new-window "run-shell -b '$BUDDY_BIN ensure'"
set-hook -g window-linked "run-shell -b '$BUDDY_BIN ensure'"
set-hook -g client-session-changed "run-shell -b '$BUDDY_BIN ensure'"
set-hook -g after-select-window "run-shell -b '$BUDDY_BIN ensure'"
set-hook -g session-window-changed "run-shell -b '$BUDDY_BIN ensure'"

bind-key Tab display-popup -w 90% -h 90% -E "~/.cargo/bin/pluck"

run '~/.tmux/plugins/tpm/tpm'
